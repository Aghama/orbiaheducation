name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build
        run: pnpm build


      - name: Validate deployment settings
        shell: bash
        env:
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_SERVER: ${{ secrets.SFTP_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: |
          test -n "$SFTP_USERNAME" || { echo "SFTP_USERNAME is empty"; exit 1; }
          test -n "$SFTP_SERVER" || { echo "SFTP_SERVER is empty"; exit 1; }

          if [ -z "$SFTP_PASSWORD" ] && [ -z "$SSH_PRIVATE_KEY" ]; then
          echo "Neither SFTP_PASSWORD nor SSH_PRIVATE_KEY is set"
          exit 1
          fi

           echo "Username and server are configured"

      
      - name: Deploy to cPanel
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.CPANEL_SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          port: 21098
          local_path: ./dist/public/*
          remote_path: public_html/
          sftp_only: true
          delete_remote_files: false

      
