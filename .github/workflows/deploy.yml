name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Validate SFTP credentials
        env:
          DEPLOY_USERNAME: ${{ secrets.SFTP_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          if [ -z "$DEPLOY_USERNAME" ]; then
            echo "::error::SFTP_USERNAME is unavailable to this workflow"
            exit 1
          fi

          if [ -z "$DEPLOY_PASSWORD" ]; then
            echo "::error::SFTP_PASSWORD is unavailable to this workflow"
            exit 1
          fi

          echo "SFTP credentials are available."

      - name: Deploy dist/public to Namecheap cPanel over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: premium362.web-hosting.com
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21098
          local_path: './dist/public/*'
          remote_path: '/public_html/'
          sftp_only: true
          delete_remote_files: false