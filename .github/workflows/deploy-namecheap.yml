name: Build and deploy Orbiah Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build static production files
        run: pnpm build

      - name: Deploy dist/public to Namecheap cPanel over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.CPANEL_SFTP_HOST }}
          username: ${{ secrets.CPANEL_SFTP_USERNAME }}
          ssh_private_key: ${{ secrets.CPANEL_SFTP_PRIVATE_KEY }}
          local_path: './dist/public/*'
          remote_path: ${{ secrets.CPANEL_REMOTE_PATH }}
          sftp_only: true
          delete_remote_files: false
